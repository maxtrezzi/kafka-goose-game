name: CI

# Runs on every branch, so a branch is checked while it is being worked on and
# not only once a pull request exists, and on pull requests, which is the only
# trigger that covers a fork.
#
# Both events fire for a pull request opened from a branch of this repository,
# which would run everything twice. The condition on each job below keeps the
# pull_request run only when it adds something: when the branch lives in
# another repository and the push event therefore never happened here.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A second push to the same branch makes the run already in flight pointless.
# On main every commit is kept, because that history is what people land on.
#
# The event name is part of the group on purpose. Without it, the pull_request
# run and the push run for the same branch share a group, and the one that
# starts second cancels the first — so the push run gets cancelled and the
# pull_request run is then skipped by the condition below, leaving the commit
# with no checks at all.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # `verify` runs both layers: the unit tests through surefire in every
      # module, and the integration tests through failsafe in `server` (the
      # end-to-end game) and `client-core` (GameClient against a broker), which
      # start a real Kafka broker with Testcontainers. Docker is already
      # installed on the runner, so nothing extra is needed for it.
      #
      # This also covers the two things a local build cannot: it builds from a
      # clean clone, with an empty local repository, and it runs the
      # integration tests against whatever Docker version the runner ships.
      - name: mvn verify
        run: mvn -B verify

      - name: Keep the test reports when something fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: "**/target/*-reports/"
          if-no-files-found: ignore

  demo:
    name: Docker demo
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # The README's one-command demo, run for real: the 3-broker cluster and
      # the server from docker-compose.yml, then two players from the `tui`
      # image joining and starting a game. It checks what the unit and
      # integration tests cannot: the Dockerfile, the compose wiring, and the
      # 3-broker cluster with its replication settings.
      - name: Start the cluster and the server
        run: docker compose --profile game up -d --build

      - name: Wait for the server to finish its replay
        run: |
          for i in $(seq 60); do
            docker logs goose-server 2>&1 | grep -q "replayed" && break
            sleep 2
          done
          docker logs goose-server 2>&1 | grep "replayed"

      - name: Two players join and start a game
        run: |
          printf 'join\nquit\n'  | docker compose run --rm -T tui ci-game alice
          printf 'join\nquit\n'  | docker compose run --rm -T tui ci-game bob
          printf 'start\nquit\n' | docker compose run --rm -T tui ci-game alice

      - name: The game started, according to the event log
        run: |
          for i in $(seq 30); do
            docker exec goose-kafka-1 /opt/kafka/bin/kafka-console-consumer.sh \
              --bootstrap-server localhost:29092 --topic game.events \
              --from-beginning --timeout-ms 5000 2>/dev/null > events.txt || true
            grep -q '"type":"GameStarted"' events.txt && break
            sleep 2
          done
          cat events.txt
          grep -q '"type":"GameStarted"' events.txt

      - name: Server log
        if: always()
        run: docker logs goose-server || true

      - name: Stop everything
        if: always()
        run: docker compose --profile game down

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install pandoc, WeasyPrint and poppler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pandoc poppler-utils fonts-dejavu-core \
            libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b libffi8
          # pipx, not pip: the runner's system Python refuses installs into it.
          # The version is pinned so the rendering does not change under us.
          pipx install "weasyprint==69.0"
          weasyprint --version
          pandoc --version | head -1

      # Fails on a broken internal link — a renamed heading breaks every link
      # that pointed at it, silently. External links only fail the build when
      # the server says the page is gone; a timeout or a rate limit is a
      # warning, because it says more about the network than about the link.
      - name: Check the links
        run: python3 docs/check-links.py --external

      # Fails if the committed PDF is older than the Markdown, if the document
      # no longer builds cleanly, or if it contains a file:// link pointing
      # into somebody's home directory.
      - name: Check the PDF
        run: ./docs/check-pdf.sh
