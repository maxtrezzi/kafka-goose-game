name: CI

# Runs on every branch, so a branch is checked while it is being worked on and
# not only once a pull request exists, and on pull requests, which is the only
# trigger that covers a fork.
#
# Both events fire for a pull request opened from a branch of this repository,
# which would run everything twice. The condition on each job below keeps the
# pull_request run only when it adds something: when the branch lives in
# another repository and the push event therefore never happened here.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A second push to the same branch makes the run already in flight pointless.
# On main every commit is kept, because that history is what people land on.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # `verify` runs both layers: the 104 unit tests through surefire in every
      # module, and the end-to-end test through failsafe in `server`, which
      # starts a real Kafka broker with Testcontainers. Docker is already
      # installed on the runner, so nothing extra is needed for it.
      #
      # This also covers the two things a local build cannot: it builds from a
      # clean clone, with an empty local repository, and it runs the E2E
      # against whatever Docker version the runner ships — which is what the
      # api.version property in server/pom.xml exists to cope with.
      - name: mvn verify
        run: mvn -B verify

      - name: Keep the test reports when something fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: "**/target/*-reports/"
          if-no-files-found: ignore

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install pandoc, WeasyPrint and poppler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pandoc poppler-utils fonts-dejavu-core \
            libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b libffi8
          # pipx, not pip: the runner's system Python refuses installs into it.
          # The version is pinned so the rendering does not change under us.
          pipx install "weasyprint==69.0"
          weasyprint --version
          pandoc --version | head -1

      # Fails on a broken internal link — a renamed heading breaks every link
      # that pointed at it, silently. External links only fail the build when
      # the server says the page is gone; a timeout or a rate limit is a
      # warning, because it says more about the network than about the link.
      - name: Check the links
        run: python3 docs/check-links.py --external

      # Fails if the committed PDF is older than the Markdown, if the document
      # no longer builds cleanly, or if it contains a file:// link pointing
      # into somebody's home directory.
      - name: Check the PDF
        run: ./docs/check-pdf.sh
