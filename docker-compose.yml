# 3-broker Kafka cluster in KRaft mode (no ZooKeeper).
# Each node is both controller and broker ("combined mode" — fine for dev).
# No volumes on purpose: `docker compose down` gives you a fresh cluster.
#
#   Host access:      localhost:9092 / 9094 / 9096
#   In-network:       kafka-1:29092 / kafka-2:29092 / kafka-3:29092

x-kafka-common: &kafka-common
  image: apache/kafka:4.3.0
  healthcheck:
    test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 > /dev/null 2>&1"]
    interval: 10s
    timeout: 10s
    retries: 12
    start_period: 15s

x-kafka-env: &kafka-env
  # Same cluster id on all nodes (any base64-encoded UUID, 22 chars)
  CLUSTER_ID: "5L6g3nShT-eMCtK--X86sw"
  KAFKA_PROCESS_ROLES: broker,controller
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:29093,2@kafka-2:29093,3@kafka-3:29093
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
  # Internal topics must survive a broker loss too
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_MIN_INSYNC_REPLICAS: 2
  # We create game topics explicitly in init-topics; keep accidents out
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

services:
  kafka-1:
    <<: *kafka-common
    container_name: goose-kafka-1
    ports:
      - "9092:9092"
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 1
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:29093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:29092,PLAINTEXT_HOST://localhost:9092

  kafka-2:
    <<: *kafka-common
    container_name: goose-kafka-2
    ports:
      - "9094:9094"
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 2
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:29093,PLAINTEXT_HOST://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:29092,PLAINTEXT_HOST://localhost:9094

  kafka-3:
    <<: *kafka-common
    container_name: goose-kafka-3
    ports:
      - "9096:9096"
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 3
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:29093,PLAINTEXT_HOST://:9096
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-3:29092,PLAINTEXT_HOST://localhost:9096

  # One-shot: creates the game topics, prints them, exits 0
  init-topics:
    image: apache/kafka:4.3.0
    container_name: goose-init-topics
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        BIN=/opt/kafka/bin
        for topic in game.commands game.events; do
          $$BIN/kafka-topics.sh --bootstrap-server kafka-1:29092 --create --if-not-exists \
            --topic $$topic --partitions 3 --replication-factor 3 \
            --config min.insync.replicas=2
          $$BIN/kafka-topics.sh --bootstrap-server kafka-1:29092 --describe --topic $$topic
        done
